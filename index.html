<!doctype html>
<html lang="fa" dir="rtl" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدیریت مالی</title>
<meta name="theme-color" content="#060a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="مدیریت مالی">
<meta name="description" content="تقسیم درآمد بین صندوق‌ها و مدیریت پس‌انداز؛ آفلاین و خصوصی">
<link rel="stylesheet" href="app.aa0a0d6e.css">
<link rel="preload" href="fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* تم را پیش از رسم صفحه می‌گذاریم تا هنگام لودینگ رنگ اشتباه نبینی */
try{var P=JSON.parse(localStorage.getItem('fm.prefs.v1')||'{}'),m=P.mode||'dark',L=['paper','ice','mint','peach','lavender','sky'],d=document.documentElement;
var light=m==='light'||(m==='auto'&&matchMedia('(prefers-color-scheme: light)').matches);
d.dataset.theme=light?(P.lightTheme||'paper'):(P.theme||'midnight');}catch(e){}
addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('boot');if(b)b.classList.add('out')},9000)});
</script>
<style id="boot-css">
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 0%,var(--bg-1,#0b1230),var(--bg-0,#060a18));color:var(--text,#e8eeff);transition:opacity .35s ease,visibility .35s}
#boot.out{opacity:0;visibility:hidden;pointer-events:none}
#boot .bl{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1,#6b8cff),var(--a2,#a78bfa));box-shadow:0 18px 50px -14px var(--a1,#6b8cff);animation:bootpulse 1.6s ease-in-out infinite}
#boot svg{width:38px;height:38px;color:var(--on-accent,#06102a)}
#boot .bt{font:600 1.05rem Tahoma,"Segoe UI",system-ui,sans-serif;opacity:.9}
#boot .bar{width:132px;height:4px;border-radius:99px;background:rgba(127,127,160,.25);overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--a1,#6b8cff),var(--a2,#a78bfa));animation:bootbar 1.1s ease-in-out infinite}
@keyframes bootpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes bootbar{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){#boot .bl,#boot .bar i{animation:none}}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite" aria-label="در حال بارگذاری"><span class="bl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span><span class="bt">مدیریت مالی</span><span class="bar"><i></i></span></div>
<div id="app"></div>
<script type="module" src="app.d1cd5dad.js"></script>
</body>
</html>
